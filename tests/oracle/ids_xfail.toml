# Known IDS conformance failures — tests/oracle/ids_conformance.py.
#
# One [[xfail]] per test case, keyed "<folder>/<stem>" (no .ids suffix).
# Only benign labels may be registered:
#   label = "ifctester_bug"    ifcfast matches the filename truth, IfcTester does not
#   label = "test_case_drift"  both engines agree with each other, against the filename
#                              (triaged by a human; the case itself is believed wrong)
# `issue` is required ("#NNN" on the ifcfast tracker), `note` says why, with a source cite.
#
# Strict: an entry whose case turns green, whose IfcTester verdict starts agreeing
# with the filename, or whose observed label changes FAILS the run — remove the xfail.
# An ifcfast_bug can never be registered here; it blocks until fixed.
#
# Example:
# [[xfail]]
# case  = "tolerance/pass-comparison_tolerance_for_floating_point_one_lower_bound"
# label = "ifctester_bug"
# issue = "#NNN"
# note  = "IfcTester is_x() is relative-only (ifctester/facet.py:54-60); IDS tolerance.md adds an absolute 1e-6 term"

# --- IfcTester 0.8.5 divergences, attributed by source reading (GH #193) ---

[[xfail]]
case = "tolerance/pass-comparison_tolerance_for_floating_point_negative_high_number_lower_bound"
label = "ifctester_bug"
issue = "#193"
note = "IfcTester is_x() is relative-only (ifctester/facet.py:53-60); tolerance.md requires v ± (|v|·1e-6 + 1e-6)"

