[[xfail]]
case = "property/pass-material_properties_are_supported_under_ifc2x3_via_extendedmaterialproperties"
label = "ifctester_bug"
issue = "#193"
note = "IfcTester reads pset.Properties for every IfcMaterialProperties (ifctester/facet.py:912-913); IFC2X3 IfcExtendedMaterialProperties has ExtendedProperties, so it raises AttributeError; ifcopenshell.util.element.get_psets resolves the pset correctly and the requirement is met"
