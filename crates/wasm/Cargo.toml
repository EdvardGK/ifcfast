[package]
name = "ifcfast-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ifcfast in the browser — client-side IFC parsing, QTO and glTF (GH #172)"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No pyo3, no arrow/parquet, no parry, no manifold — `mesh` only. The
# `mmap` feature is off: the browser hands us bytes, never a path.
# `[lib] name` in the core crate is `_core` (maturin needs that for
# `ifcfast._core`), so rename the dependency to reach it as
# `ifcfast_core` here.
ifcfast_core = { package = "ifcfast-core", path = "../core", default-features = false, features = ["mesh"] }
# Pinned to the `wasm-bindgen` CLI shipped in ~/.cargo/bin: the generated
# glue and the crate's ABI must be the same version or the CLI refuses.
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `cache_key` parity with `python/ifcfast/header.py::_compute_cache_key`
# — sha256 over (schema version, size, head 4 MiB, tail 4 MiB).
sha2 = "0.10"
