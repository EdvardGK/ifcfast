[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ifcfast"
version = "0.5.0"
description = "Fast native IFC parsing, data extraction, and geometric analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Edvard Granskogen Kjorstad", email = "ed.subscript@gmail.com" },
]
keywords = ["IFC", "BIM", "QTO", "parser", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "openpyxl>=3.1.0",          # used by validate.py for Solibri ITO reads
    "ifcopenshell==0.8.5",      # (1) codegen: regenerates python/ifcfast/data/schema_supertypes.py
                                #     via scripts/gen_schema_supertypes.py, and
                                # (2) differential-testing oracle for tests/oracle (GH #59) —
                                #     opens each tiny fixture in both libs and diffs the
                                #     agent-visible surfaces (quantities/psets/materials).
                                # Pinned for reproducible oracle ground truth.
                                # Test-only / codegen-only — NEVER a runtime dep, never in the wheel.
]
mcp = [
    "mcp[cli]>=1.0",            # ifcfast-mcp server (Claude Desktop / Cursor / etc.)
]

[project.scripts]
ifcfast = "ifcfast.cli:main"
ifcfast-mcp = "ifcfast.mcp_server:main"

[project.urls]
Homepage = "https://github.com/EdvardGK/ifcfast"
Issues = "https://github.com/EdvardGK/ifcfast/issues"

[tool.maturin]
manifest-path = "crates/core/Cargo.toml"
module-name = "ifcfast._core"
features = ["python", "mesh", "csg"]
strip = true
python-source = "python"
# LICENSE / AGENTS.md live outside python-source, so they need an explicit
# entry to land in the sdist. Files under python-source (data/minimal.ifc,
# data/AGENTS.md, py.typed, etc.) are auto-packaged into both wheel and
# sdist by maturin.
#
# GH #157 — why AGENTS.md is COPIED into python/ifcfast/data/ instead of
# just widening this entry to `format = ["sdist", "wheel"]`: a
# [tool.maturin] include path is materialised in the wheel at the same
# path relative to the wheel ROOT, i.e. `site-packages/AGENTS.md`. That
# is not importable as package data (`importlib.resources` / the
# `Path(__file__).parent` lookup in `ifcfast.agents_guide()` can't see
# it), and it litters site-packages with a generic filename that would
# collide with any other package doing the same. The only tree maturin
# puts INSIDE the package is python-source, so the guide is mirrored to
# `python/ifcfast/data/AGENTS.md` and `tests/test_agents_guide.py` gates
# the two copies byte-for-byte. The root file stays canonical.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "AGENTS.md", format = "sdist" },
]
